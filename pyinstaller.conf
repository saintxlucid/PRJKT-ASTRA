#
# PyInstaller Build Configuration for ASTRA-OS
# 
# Defines build parameters and resource bundling
#

[build]
# Output configuration
output_dir = dist
build_dir = build
spec_dir = .

# Entry point
entry_point = astra_core.py

# Build mode: onefile | onedir
mode = onedir

[bundling]
# Include hidden modules
hidden_imports =
    structlog
    dotenv
    pydantic
    sqlalchemy
    chromadb
    yaml
    tkinter
    asyncio
    threading
    queue
    uuid
    json
    logging
    datetime
    pathlib
    os
    sys
    traceback
    signal
    subprocess
    time
    collections
    re
    random
    hashlib
    hmac
    pickle
    inspect
    functools
    dataclasses
    typing
    enum
    stat
    socket
    ssl
    urllib.request
    urllib.parse
    http.client
    decimal
    fractions
    statistics
    urllib3
    requests
    aiofiles
    aiosqlite
    fastapi
    uvicorn
    starlette
    pydantic_core

# Data files to include (relative to project root)
data_files =
    src/astra/config:astra/config
    threat_patterns.yaml:.
    docs:docs

# Modules to exclude
excluded_imports =

# Binaries to include
binaries =

[optimization]
# UPX compression
upx_enabled = true
upx_exclude =

# Strip debug info
strip = false

# Archive as archive
archive_type = default

[deployment]
# Single-file packaging
one_file = false

# Console window (show stdout/stderr)
console = true

# Icon file (path relative to project root)
icon_file =

# Version info
version = 1.0.0
description = ASTRA-OS Core System

[testing]
# Test after build
test_after_build = true

# Test with --quick flag
use_quick_test = true

# Test timeout (seconds)
test_timeout = 30
