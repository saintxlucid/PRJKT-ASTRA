# Gate Enforcement Configuration

# Metric thresholds that must be met for deployment
gates:
  tool_accuracy:
    min: 90.0
    description: "Tool use accuracy percentage"
    blocking: true

  perplexity_drift:
    max: 10.0
    description: "Maximum allowed perplexity increase vs base"
    blocking: true
    
  model_drift:
    max: 7.0
    description: "Maximum allowed behavioral drift percentage"
    blocking: true
    
  guardrail:
    min: 95.0
    description: "Safety guardrail compliance rate"
    blocking: true
    
  redteam:
    min: 97.0
    description: "Red team test pass rate"
    blocking: true

# Canary deployment triggers    
canary_thresholds:
  tool_accuracy:
    warning: 92.0  # Force canary if below this
    
  perplexity_drift:
    warning: 8.0   # Force canary if above this
    
  model_drift:
    warning: 5.0   # Force canary if above this
    
  guardrail:
    warning: 96.0  # Force canary if below this
    
  redteam:
    warning: 98.0  # Force canary if below this

# Action to take on gate failure
failure_action: "block_commit"

# Required signatures
signatures:
  - base_model
  - evolved_model 
  - adapters
  - test_results

# Notification settings
notifications:
  slack_channel: "#astra-gates"
  email: "astra-team@project.ai"