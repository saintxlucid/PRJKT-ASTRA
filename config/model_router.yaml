# SPDX-License-Identifier: MIT
# Multi-Model Router Configuration for ASTRA Core
# ==================================================
# Defines all available models, their endpoints, and routing policies.

# Network topology
topology:
  gateway:
    type: vllm  # Primary: vLLM OpenAI-compatible server
    host: localhost
    port: 8000
    base_url: "http://localhost:8000/v1"
  
  sidecars:
    llamacpp:
      host: localhost
      port: 8001
      base_url: "http://localhost:8001"
    
    tensorrt:
      host: localhost
      port: 8002
      base_url: "http://localhost:8002"
    
    whisper:
      host: localhost
      port: 8003
      base_url: "http://localhost:8003"

# Model registry
models:
  # === PRIMARY REASONING ===
  
  deepseek_v3_1:
    enabled: true
    display_name: "DeepSeek-V3.1"
    model_path: "deepseek-ai/DeepSeek-V3.1"
    backend: vllm
    endpoint: "http://localhost:8000/v1/chat/completions"
    
    # Capabilities
    modalities: [text]
    task_types: [reasoning, tool_calling, long_context, code_generation]
    
    # Performance
    context_window: 131072  # 128K
    max_tokens_per_sec: 50.0
    avg_latency_ms: 500.0
    min_vram_gb: 40.0
    
    # Features
    supports_tool_calling: true
    supports_streaming: true
    quantization: "FP16"
    priority: 95  # Highest for reasoning
    
    # vLLM-specific
    vllm_args:
      max_model_len: 131072
      tensor_parallel_size: 2  # Multi-GPU
      tool_call_parser: "openai"
      enable_prefix_caching: true
  
  mistral_large_2:
    enabled: true
    display_name: "Mistral-Large-2"
    model_path: "mistralai/Mistral-Large-2-Instruct"
    backend: vllm
    endpoint: "http://localhost:8000/v1/chat/completions"
    
    modalities: [text]
    task_types: [reasoning, tool_calling, code_generation, long_context]
    
    context_window: 32768
    max_tokens_per_sec: 45.0
    avg_latency_ms: 450.0
    min_vram_gb: 32.0
    
    supports_tool_calling: true
    supports_streaming: true
    quantization: "FP16"
    priority: 90
    
    vllm_args:
      max_model_len: 32768
      tensor_parallel_size: 1
      tool_call_parser: "mistral"
  
  # === VISION-LANGUAGE ===
  
  llama_3_2_vision_11b:
    enabled: true
    display_name: "Llama-3.2-Vision-11B"
    model_path: "meta-llama/Llama-3.2-11B-Vision-Instruct"
    backend: vllm
    endpoint: "http://localhost:8000/v1/chat/completions"
    
    modalities: [text, image, multimodal]
    task_types: [vision_qa, vision_analysis]
    
    context_window: 8192
    max_tokens_per_sec: 30.0
    avg_latency_ms: 800.0
    min_vram_gb: 24.0
    
    supports_tool_calling: false
    supports_streaming: true
    quantization: "FP16"
    priority: 90
    
    vllm_args:
      max_model_len: 8192
      limit_mm_per_prompt: "image=1"
  
  qwen_2_5_vl_7b:
    enabled: true
    display_name: "Qwen2.5-VL-7B"
    model_path: "Qwen/Qwen2-VL-7B-Instruct"
    backend: vllm
    endpoint: "http://localhost:8000/v1/chat/completions"
    
    modalities: [text, image, multimodal]
    task_types: [vision_qa, vision_analysis]
    
    context_window: 8192
    max_tokens_per_sec: 35.0
    avg_latency_ms: 700.0
    min_vram_gb: 16.0
    
    supports_tool_calling: true
    supports_streaming: true
    quantization: "FP16"
    priority: 85
    
    vllm_args:
      max_model_len: 8192
      limit_mm_per_prompt: "image=1"
      tool_call_parser: "hermes"
  
  gemma_3:
    enabled: false  # Enable when licensed/available
    display_name: "Gemma-3"
    model_path: "google/gemma-3-multimodal"
    backend: vllm
    endpoint: "http://localhost:8000/v1/chat/completions"
    
    modalities: [text, image, video, multimodal]
    task_types: [vision_qa, vision_analysis, fast_chat]
    
    context_window: 8192
    max_tokens_per_sec: 40.0
    avg_latency_ms: 600.0
    min_vram_gb: 24.0
    
    supports_tool_calling: false
    supports_streaming: true
    quantization: "FP16"
    priority: 80
    
    vllm_args:
      max_model_len: 8192
      limit_mm_per_prompt: "image=1;video=1"
  
  # === FAST CHAT / EDGE ===
  
  phi_4_mini:
    enabled: true
    display_name: "Phi-4-mini"
    model_path: "models/phi-4-mini-instruct.Q5_K_M.gguf"
    backend: llamacpp
    endpoint: "http://localhost:8001/v1/chat/completions"
    
    modalities: [text]
    task_types: [fast_chat, edge, tool_calling]
    
    context_window: 4096
    max_tokens_per_sec: 60.0
    avg_latency_ms: 200.0
    min_vram_gb: 4.0
    
    supports_tool_calling: true
    supports_streaming: true
    quantization: "GGUF-Q5_K_M"
    priority: 70
    
    llamacpp_args:
      n_ctx: 4096
      n_threads: 8
      n_gpu_layers: 35  # Full offload on decent GPU
  
  qwen_2_5_1_5b:
    enabled: true
    display_name: "Qwen2.5-1.5B-Instruct"
    model_path: "models/qwen2.5-1.5b-instruct.Q4_K_M.gguf"
    backend: llamacpp
    endpoint: "http://localhost:8001/v1/chat/completions"
    
    modalities: [text]
    task_types: [fast_chat, edge]
    
    context_window: 32768
    max_tokens_per_sec: 80.0
    avg_latency_ms: 150.0
    min_vram_gb: 2.0
    
    supports_tool_calling: false
    supports_streaming: true
    quantization: "GGUF-Q4_K_M"
    priority: 65
    
    llamacpp_args:
      n_ctx: 32768
      n_threads: 8
      n_gpu_layers: 0  # CPU-only for edge
  
  llama_3_2_3b:
    enabled: true
    display_name: "Llama-3.2-3B-Instruct"
    model_path: "models/llama-3.2-3b-instruct.Q5_K_M.gguf"
    backend: llamacpp
    endpoint: "http://localhost:8001/v1/chat/completions"
    
    modalities: [text]
    task_types: [fast_chat, edge]
    
    context_window: 8192
    max_tokens_per_sec: 75.0
    avg_latency_ms: 180.0
    min_vram_gb: 3.0
    
    supports_tool_calling: false
    supports_streaming: true
    quantization: "GGUF-Q5_K_M"
    priority: 68
    
    llamacpp_args:
      n_ctx: 8192
      n_threads: 8
      n_gpu_layers: 0  # CPU-only
  
  # === AUDIO ===
  
  whisper_large_v3:
    enabled: true
    display_name: "Whisper-Large-V3"
    model_path: "models/whisper-large-v3-turbo.gguf"
    backend: whisper
    endpoint: "http://localhost:8003/transcribe"
    
    modalities: [audio]
    task_types: [asr]
    
    context_window: 30  # 30 seconds max
    max_tokens_per_sec: 0.0  # N/A
    avg_latency_ms: 1000.0
    min_vram_gb: 8.0
    
    supports_tool_calling: false
    supports_streaming: false
    quantization: "INT8"
    priority: 100  # Only ASR option
    
    whisper_args:
      model_size: "large-v3"
      device: "cuda"  # or "cpu"
      compute_type: "int8"
      beam_size: 5
  
  # === LEGACY / FALLBACK ===
  
  gpt_oss_20b:
    enabled: true
    display_name: "GPT-OSS-20B (Legacy)"
    model_path: "models/gpt-oss-20b.q5_k_m.gguf"
    backend: llamacpp
    endpoint: "http://localhost:8001/v1/chat/completions"
    
    modalities: [text]
    task_types: [reasoning, fast_chat, code_generation]
    
    context_window: 8192
    max_tokens_per_sec: 12.0
    avg_latency_ms: 1500.0
    min_vram_gb: 0.0  # CPU-only
    
    supports_tool_calling: true  # Via adapters
    supports_streaming: false
    quantization: "GGUF-Q5_K_M"
    priority: 50  # Fallback only
    
    llamacpp_args:
      n_ctx: 8192
      n_threads: 12
      n_gpu_layers: 0  # CPU-only

# Routing policies
routing:
  # Default policy (can be overridden per route)
  default_policy:
    # If input has images → vision route
    image_models: [llama_3_2_vision_11b, qwen_2_5_vl_7b, gemma_3]
    
    # If audio → transcribe first
    audio_models: [whisper_large_v3]
    
    # Reasoning tasks
    reasoning_models: [deepseek_v3_1, mistral_large_2, gpt_oss_20b]
    
    # Fast chat (prefer edge)
    fast_chat_models: [phi_4_mini, qwen_2_5_1_5b, llama_3_2_3b]
    
    # Tool calling
    tool_calling_models: [deepseek_v3_1, mistral_large_2, qwen_2_5_vl_7b, phi_4_mini]
    
    # Fallback chain
    fallback_order: [deepseek_v3_1, mistral_large_2, gpt_oss_20b]
  
  # Latency thresholds (ms)
  latency_sla:
    fast_chat: 300
    vision_qa: 1000
    reasoning: 2000
    asr: 1500
  
  # Resource allocation
  resource_limits:
    max_concurrent_vllm: 10
    max_concurrent_llamacpp: 5
    max_concurrent_whisper: 3
  
  # Health checks
  health_check:
    interval_seconds: 30
    timeout_seconds: 5
    failure_threshold: 3  # Mark unhealthy after N failures
  
  # A/B testing
  canary:
    enabled: false
    percentage: 10  # % of traffic to canary
    canary_model: "mistral_large_2"
    stable_model: "deepseek_v3_1"

# Tool/Function schemas (JSON Schema)
tools:
  web_search:
    name: "web_search"
    description: "Search the web for current information"
    parameters:
      type: "object"
      properties:
        query:
          type: "string"
          description: "Search query"
        num_results:
          type: "integer"
          description: "Number of results to return"
          default: 5
      required: ["query"]
  
  code_run:
    name: "code_run"
    description: "Execute Python code in a sandboxed environment"
    parameters:
      type: "object"
      properties:
        code:
          type: "string"
          description: "Python code to execute"
        timeout:
          type: "integer"
          description: "Execution timeout in seconds"
          default: 30
      required: ["code"]
  
  fs_read:
    name: "fs_read"
    description: "Read file contents from filesystem"
    parameters:
      type: "object"
      properties:
        path:
          type: "string"
          description: "File path to read"
      required: ["path"]
  
  fs_write:
    name: "fs_write"
    description: "Write content to filesystem"
    parameters:
      type: "object"
      properties:
        path:
          type: "string"
          description: "File path to write"
        content:
          type: "string"
          description: "Content to write"
      required: ["path", "content"]
  
  git_diff:
    name: "git_diff"
    description: "Get git diff for repository"
    parameters:
      type: "object"
      properties:
        repo_path:
          type: "string"
          description: "Path to git repository"
        commit:
          type: "string"
          description: "Commit hash (optional)"
      required: ["repo_path"]
  
  eval_run:
    name: "eval_run"
    description: "Run evaluation suite"
    parameters:
      type: "object"
      properties:
        eval_name:
          type: "string"
          description: "Name of evaluation to run"
      required: ["eval_name"]
  
  asr_transcribe:
    name: "asr_transcribe"
    description: "Transcribe audio to text"
    parameters:
      type: "object"
      properties:
        audio_uri:
          type: "string"
          description: "Path or URL to audio file"
        language:
          type: "string"
          description: "Language code (e.g., 'en', 'es')"
          default: "en"
      required: ["audio_uri"]
  
  img_analyze:
    name: "img_analyze"
    description: "Analyze image with vision model"
    parameters:
      type: "object"
      properties:
        image_uri:
          type: "string"
          description: "Path or URL to image"
        question:
          type: "string"
          description: "Question about the image"
      required: ["image_uri", "question"]

# Observability
observability:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  
  logging:
    level: "INFO"
    format: "json"
    per_model_logs: true
  
  tracing:
    enabled: false  # Enable for distributed tracing
    jaeger_endpoint: "http://localhost:14268/api/traces"
  
  cost_tracking:
    enabled: true
    track_by: [model, task_type, modality]
    metrics:
      - wall_clock_seconds
      - gpu_seconds
      - tokens_processed
      - energy_estimate_kwh
