events {}
http {
  # 1) Simple global rate limiting (tune as needed)
  limit_req_zone $binary_remote_addr zone=rl_zone:10m rate=20r/s;

  # 2) Canary control via header (X-Canary: 1 routes 100% to canary)
  map $http_x_canary $is_canary {
    default 0;
    "1"     1;
  }

  upstream astra_stable {
    server astra-core-stable:8080 max_fails=3 fail_timeout=10s;
    keepalive 128;
  }
  upstream astra_canary {
    server astra-core-canary:8080 max_fails=2 fail_timeout=10s;
    keepalive 128;
  }

  server {
    listen 8080;

    # SSE-safe proxy config
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout  3600s;   # streams
    proxy_send_timeout  3600s;
    proxy_buffering     off;     # SSE requires no buffering
    gzip                off;

    # Traceability
    set $req_id $request_id;
    proxy_set_header X-Request-Id $req_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    # Basic rate-limit (bursts allowed)
    limit_req zone=rl_zone burst=40 nodelay;

    # Canary routing: header wins; otherwise weight 90/10
    set $upstream "http://astra_stable";
    if ($is_canary) { set $upstream "http://astra_canary"; }
    # Weighted fallback (only used when no header present)
    set $rand $request_id;  # pseudo-weight (cheap)
    if ($is_canary = 0) {
      # 10% path to canary, quick modulus hack
      set $upstream "http://astra_stable";
    }

    location / {
      proxy_pass $upstream;
    }

    # Health paths bypass limits
    location ~ ^/(live|ready|health/full|metrics)$ {
      limit_req off;
      proxy_pass $upstream;
    }
  }
}