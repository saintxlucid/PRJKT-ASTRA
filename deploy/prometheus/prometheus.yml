global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: "astra-core"
    static_configs:
      - targets: ["astra-core:8080"]   # or "localhost:8080" in dev
    metrics_path: /metrics

  - job_name: "locust"
    static_configs:
      - targets: ["locust:8089"]       # optional if you expose locust metrics