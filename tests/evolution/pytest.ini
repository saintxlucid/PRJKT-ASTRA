# pytest configuration for ASTRA Evolution Backend tests
[pytest]
testpaths = tests/evolution
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests
    security: Security-related tests
    performance: Performance benchmarks
    slow: Slow running tests
minversion = 7.0
addopts = 
    -v 
    --strict-markers 
    --tb=short
    --cov=astra.evolution.backend 
    --cov-report=term-missing
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning