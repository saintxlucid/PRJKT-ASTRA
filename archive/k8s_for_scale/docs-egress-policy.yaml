apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docs-egress-only-allowed
  namespace: astra
  labels:
    app: docs
spec:
  podSelector:
    matchLabels:
      app: docs
  policyTypes:
    - Egress
    - Ingress
  # Allow ingress from ingress controller
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8777
  # Restrict egress
  egress:
    # Allow Qdrant
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
    # Allow Prometheus
    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS for model downloads (sentence-transformers)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
