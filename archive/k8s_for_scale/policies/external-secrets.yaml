# External Secrets Operator Configuration for ASTRA Core
# Replaces hardcoded env files with secure secret management

---
# ExternalSecret: Fetch secrets from external store (AWS/GCP/Azure)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: astra-core-secrets
  namespace: astra-production
  labels:
    app: astra-core
    component: security
spec:
  refreshInterval: 1h  # Refresh secrets hourly
  
  secretStoreRef:
    name: aws-secrets-manager  # or gcp-secret-manager, azure-key-vault
    kind: ClusterSecretStore
  
  target:
    name: astra-core-secrets
    creationPolicy: Owner
  
  data:
    # Admin authentication key
    - secretKey: ASTRA_ADMIN_KEY
      remoteRef:
        key: astra/admin
        property: ADMIN_KEY
    
    # API keys (CSV format)
    - secretKey: ASTRA_API_KEYS
      remoteRef:
        key: astra/api
        property: API_KEYS
    
    # LLM provider keys (if using cloud APIs)
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: astra/llm
        property: OPENAI_API_KEY
    
    # Database credentials
    - secretKey: DATABASE_URL
      remoteRef:
        key: astra/database
        property: URL
    
    # Redis credentials
    - secretKey: REDIS_URL
      remoteRef:
        key: astra/redis
        property: URL

---
# ClusterSecretStore: AWS Secrets Manager (example)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app: astra-core
    component: security
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        # Use IRSA (IAM Roles for Service Accounts)
        jwt:
          serviceAccountRef:
            name: astra-core-sa
            namespace: astra-production

