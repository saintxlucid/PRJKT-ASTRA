# ASTRA Core - Security Policies & Hardening
# These manifests enforce security best practices for production deployment

---
# Istio AuthorizationPolicy: Protect admin endpoints
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: astra-admin-protect
  namespace: astra-production
  labels:
    app: astra-core
    component: security
spec:
  selector:
    matchLabels:
      app: astra-core
  action: ALLOW
  rules:
    # Admin endpoints only accessible from ops CIDRs
    - to:
        - operation:
            paths:
              - "/drain"
              - "/admin/*"
      from:
        - source:
            ipBlocks:
              - "10.0.0.0/8"      # Internal corporate network
              - "192.168.0.0/16"  # Internal VPC
              # Add your ops/bastion IPs here

---
# PodDisruptionBudget: Maintain availability during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: astra-core-pdb
  namespace: astra-production
  labels:
    app: astra-core
    component: availability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: astra-core

---
# NetworkPolicy: Allow ingress from Prometheus and Istio
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: astra-allow-prometheus-ingress
  namespace: astra-production
  labels:
    app: astra-core
    component: security
spec:
  podSelector:
    matchLabels:
      app: astra-core
  policyTypes:
    - Ingress
  ingress:
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 9090
    
    # Allow Istio/ingress traffic
    - from:
        - namespaceSelector:
            matchLabels:
              istio-injection: enabled
      ports:
        - protocol: TCP
          port: 8001

---
# NetworkPolicy: Restrict egress to necessary services only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: astra-core-egress-policy
  namespace: astra-production
  labels:
    app: astra-core
    component: security
spec:
  podSelector:
    matchLabels:
      app: astra-core
  policyTypes:
    - Egress
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    
    # Qdrant vector database
    - to:
        - podSelector:
            matchLabels:
              app: qdrant
      ports:
        - protocol: TCP
          port: 6333
    
    # Redis cache
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    
    # PostgreSQL database (if used)
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432

---
# ServiceAccount: Least-privilege service account for ASTRA Core
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astra-core-sa
  namespace: astra-production
  labels:
    app: astra-core
    component: security

---
# Role: Minimal permissions for pod operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astra-core-role
  namespace: astra-production
  labels:
    app: astra-core
    component: security
rules:
  # Allow reading own pod info (for health checks)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  
  # Allow reading ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  
  # Allow reading Secrets (managed by External Secrets Operator)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
# RoleBinding: Bind service account to role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astra-core-rolebinding
  namespace: astra-production
  labels:
    app: astra-core
    component: security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astra-core-role
subjects:
  - kind: ServiceAccount
    name: astra-core-sa
    namespace: astra-production

---
# PodSecurityPolicy (if PSP still in use - deprecated in K8s 1.25+)
# Consider migrating to Pod Security Standards (PSS) or OPA/Gatekeeper
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: astra-core-psp
  labels:
    app: astra-core
    component: security
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true
