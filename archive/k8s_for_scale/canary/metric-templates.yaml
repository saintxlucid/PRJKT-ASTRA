---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: memory-usage-percentage
  namespace: astra-production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    avg(
      container_memory_working_set_bytes{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*",
        container="astra-core"
      }
      /
      container_spec_memory_limit_bytes{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*",
        container="astra-core"
      }
    ) * 100

---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: cpu-usage-percentage
  namespace: astra-production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    avg(
      rate(
        container_cpu_usage_seconds_total{
          namespace="{{ namespace }}",
          pod=~"{{ target }}-canary.*",
          container="astra-core"
        }[{{ interval }}]
      )
      /
      container_spec_cpu_quota{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*",
        container="astra-core"
      }
      * 100000
    ) * 100
