  namespace: astra-production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    sum(rate(
      astra_vector_queries_total{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*",
        status="success"
      }[{{ interval }}]
    ))
    /
    sum(rate(
      astra_vector_queries_total{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*"
      }[{{ interval }}]
    )) * 100

