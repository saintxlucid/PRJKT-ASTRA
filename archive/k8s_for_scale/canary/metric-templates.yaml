---
# Flagger MetricTemplates for ASTRA Core Canary Analysis
# These templates define reusable Prometheus queries for canary validation

apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: p95-latency
  namespace: astra-production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    histogram_quantile(0.95,
      sum(rate(
        astra_request_duration_seconds_bucket{
          namespace="{{ namespace }}",
          pod=~"{{ target }}-canary.*"
        }[{{ interval }}]
      )) by (le)
    ) * 1000

---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: p99-latency
  namespace: astra-production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    histogram_quantile(0.99,
      sum(rate(
        astra_request_duration_seconds_bucket{
          namespace="{{ namespace }}",
          pod=~"{{ target }}-canary.*"
        }[{{ interval }}]
      )) by (le)
    ) * 1000

---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: error-rate-percentage
  namespace: astra-production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    sum(rate(
      astra_errors_total{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*"
      }[{{ interval }}]
    ))
    /
    sum(rate(
      astra_requests_total{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*"
      }[{{ interval }}]
    )) * 100

---
apiVersion: flagger.app/v1beta1
kind: MetricTemplate
metadata:
  name: success-rate-percentage
  namespace: astra-production
spec:
  provider:
    type: prometheus
    address: http://prometheus.monitoring:9090
  query: |
    sum(rate(
      astra_requests_total{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*"
      }[{{ interval }}]
    ))
    -
    sum(rate(
      astra_errors_total{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*"
      }[{{ interval }}]
    ))
    /
    sum(rate(
      astra_requests_total{
        namespace="{{ namespace }}",
        pod=~"{{ target }}-canary.*"
      }[{{ interval }}]
    )) * 100

---
apiVersion: flagger.app/v1beta1
