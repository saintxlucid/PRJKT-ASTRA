---
# Manual Canary Deployment (without Flagger)
# This approach uses standard Kubernetes resources with weight-based traffic splitting

# Production Deployment (Stable)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-core-stable
  namespace: astra-production
  labels:
    app: astra-core
    version: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: astra-core
      version: stable
  template:
    metadata:
      labels:
        app: astra-core
        version: stable
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: astra-core
        image: astra-core:v1.0.0  # Current stable version
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: VERSION
          value: "stable"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /live
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Canary Deployment (New Version)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astra-core-canary
  namespace: astra-production
  labels:
    app: astra-core
    version: canary
spec:
  replicas: 1  # Start with 1 replica (10% traffic with 3 stable + 7 canary = 10 total)
  selector:
    matchLabels:
      app: astra-core
      version: canary
  template:
    metadata:
      labels:
        app: astra-core
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: astra-core
        image: astra-core:v1.1.0  # New canary version
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: VERSION
          value: "canary"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /live
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Service (routes to both stable and canary)
apiVersion: v1
kind: Service
metadata:
  name: astra-core
  namespace: astra-production
  labels:
    app: astra-core
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  selector:
    app: astra-core  # Routes to both stable and canary pods
---
# Service for stable only (for comparison)
apiVersion: v1
kind: Service
metadata:
  name: astra-core-stable
  namespace: astra-production
  labels:
    app: astra-core
    version: stable
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  selector:
    app: astra-core
    version: stable
---
# Service for canary only (for testing)
apiVersion: v1
kind: Service
metadata:
  name: astra-core-canary
  namespace: astra-production
  labels:
    app: astra-core
    version: canary
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  selector:
    app: astra-core
    version: canary
---
# VirtualService for Istio (if using service mesh)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: astra-core
  namespace: astra-production
spec:
  hosts:
  - astra-core
  http:
  - match:
    - headers:
        x-canary:
          exact: "true"
    route:
    - destination:
        host: astra-core
        subset: canary
  - route:
    - destination:
        host: astra-core
        subset: stable
      weight: 90  # 90% traffic to stable
    - destination:
        host: astra-core
        subset: canary
      weight: 10  # 10% traffic to canary
---
# DestinationRule for Istio
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: astra-core
  namespace: astra-production
spec:
  host: astra-core
  subsets:
  - name: stable
    labels:
      version: stable
  - name: canary
    labels:
      version: canary
