apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-green
  namespace: astra
  labels:
    app: bridge-green
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge-green
  template:
    metadata:
      labels:
        app: bridge-green
        version: green
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: bridge
          image: REGISTRY/your-org/astra-bridge:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: BRIDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bridge-keys
                  key: fallback_key
                  optional: true
            - name: BRIDGE_KEYS_FILE
              value: /run/secrets/bridge_keys
            - name: BRIDGE_AUDIT_LOG
              value: /data/bridge_audit.log
            - name: BRIDGE_SAFE_ROOT
              value: /data/safe
            - name: LLAMA_URL
              value: http://llama:8001/v1/chat/completions
            - name: BRIDGE_PORT
              value: "8888"
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          volumeMounts:
            - name: astra-data
              mountPath: /data
            - name: bridge-keys
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: astra-data
          persistentVolumeClaim:
            claimName: astra-data-pvc
        - name: bridge-keys
          secret:
            secretName: bridge-keys
            items:
              - key: bridge_keys
                path: bridge_keys
