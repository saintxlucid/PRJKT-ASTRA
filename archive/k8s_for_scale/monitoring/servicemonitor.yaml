---
# Prometheus ServiceMonitor for ASTRA Core
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: astra-core-metrics
  namespace: astra-production
  labels:
    app: astra-core
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: astra-core
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
    scheme: http
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: service
