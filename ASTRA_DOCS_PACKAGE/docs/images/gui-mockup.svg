<!-- SVG GUI Mockup for ASTRA Dashboard -->
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Main Dashboard Container -->
  <rect x="50" y="50" width="1100" height="700" rx="15" fill="white" filter="url(#shadow)"/>
  
  <!-- Header -->
  <rect x="50" y="50" width="1100" height="80" rx="15" fill="#2c3e50"/>
  <text x="90" y="100" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">
    ASTRA Prime System
  </text>
  <circle cx="1080" cy="90" r="15" fill="#2ecc71"/>
  <text x="1020" y="95" font-family="Arial, sans-serif" font-size="14" fill="white">ONLINE</text>
  
  <!-- Status Bar -->
  <rect x="70" y="150" width="1060" height="60" rx="8" fill="#ecf0f1"/>
  <text x="90" y="175" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">
    Status: Operational | Memory: 21,045 vectors | LLM: GPT-OSS 20B | Response Time: 0.8s
  </text>
  <text x="90" y="195" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">
    Last Activity: 2 minutes ago | Active Conversations: 3 | Queue: 0/64
  </text>
  
  <!-- Left Panel - Memory Overview -->
  <rect x="70" y="230" width="350" height="500" rx="8" fill="#f8f9fa"/>
  <text x="90" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Memory System
  </text>
  
  <!-- Memory Stats -->
  <rect x="90" y="280" width="310" height="80" rx="5" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="110" y="305" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Semantic Memories</text>
  <text x="110" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#667eea">21,045</text>
  <text x="110" y="350" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">ChromaDB • BGE-M3</text>
  
  <rect x="90" y="380" width="310" height="80" rx="5" fill="white" stroke="#3498db" stroke-width="2"/>
  <text x="110" y="405" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Conversations</text>
  <text x="110" y="430" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#3498db">847</text>
  <text x="110" y="450" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">SQLite • 3.2GB</text>
  
  <rect x="90" y="480" width="310" height="80" rx="5" fill="white" stroke="#2ecc71" stroke-width="2"/>
  <text x="110" y="505" font-family="Arial, sans-serif" font-size="14" fill="#2c3e50">Search Latency</text>
  <text x="110" y="530" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2ecc71">< 100ms</text>
  <text x="110" y="550" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">p95 performance</text>
  
  <!-- Center Panel - Chat Interface -->
  <rect x="440" y="230" width="420" height="500" rx="8" fill="#f8f9fa"/>
  <text x="460" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    Active Chat
  </text>
  
  <!-- Chat Messages -->
  <rect x="460" y="280" width="380" height="400" rx="5" fill="white"/>
  
  <!-- User Message -->
  <rect x="480" y="300" width="340" height="60" rx="8" fill="#667eea"/>
  <text x="495" y="325" font-family="Arial, sans-serif" font-size="13" fill="white">
    What are your core capabilities?
  </text>
  <text x="495" y="345" font-family="Arial, sans-serif" font-size="11" fill="#e8e8ff">
    User • 2 min ago
  </text>
  
  <!-- ASTRA Response -->
  <rect x="480" y="380" width="340" height="120" rx="8" fill="#ecf0f1"/>
  <text x="495" y="405" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
    I have voice activation, semantic memory,
  </text>
  <text x="495" y="425" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
    local LLM processing, and complete
  </text>
  <text x="495" y="445" font-family="Arial, sans-serif" font-size="13" fill="#2c3e50">
    privacy protection. All data stays local.
  </text>
  <text x="495" y="475" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    ASTRA • 2 min ago • Confidence: 98%
  </text>
  
  <!-- Input Area -->
  <rect x="460" y="690" width="380" height="30" rx="15" fill="white" stroke="#667eea" stroke-width="2"/>
  <text x="480" y="710" font-family="Arial, sans-serif" font-size="13" fill="#95a5a6">
    Type your message...
  </text>
  
  <!-- Right Panel - System Metrics -->
  <rect x="880" y="230" width="250" height="500" rx="8" fill="#f8f9fa"/>
  <text x="900" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">
    System Metrics
  </text>
  
  <!-- Metrics -->
  <rect x="900" y="280" width="210" height="60" rx="5" fill="white"/>
  <text x="915" y="300" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">CPU Usage</text>
  <rect x="915" y="305" width="180" height="10" rx="5" fill="#ecf0f1"/>
  <rect x="915" y="305" width="108" height="10" rx="5" fill="#2ecc71"/>
  <text x="915" y="330" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">60%</text>
  
  <rect x="900" y="355" width="210" height="60" rx="5" fill="white"/>
  <text x="915" y="375" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">Memory Usage</text>
  <rect x="915" y="380" width="180" height="10" rx="5" fill="#ecf0f1"/>
  <rect x="915" y="380" width="126" height="10" rx="5" fill="#3498db"/>
  <text x="915" y="405" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">70%</text>
  
  <rect x="900" y="430" width="210" height="60" rx="5" fill="white"/>
  <text x="915" y="450" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d">GPU Usage</text>
  <rect x="915" y="455" width="180" height="10" rx="5" fill="#ecf0f1"/>
  <rect x="915" y="455" width="144" height="10" rx="5" fill="#e74c3c"/>
  <text x="915" y="480" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">80%</text>
  
  <!-- Quick Actions -->
  <rect x="900" y="510" width="210" height="50" rx="8" fill="#667eea"/>
  <text x="935" y="540" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
    🔄 Restart LLM
  </text>
  
  <rect x="900" y="575" width="210" height="50" rx="8" fill="#2ecc71"/>
  <text x="920" y="605" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
    📊 View Dashboard
  </text>
  
  <rect x="900" y="640" width="210" height="50" rx="8" fill="#e74c3c"/>
  <text x="930" y="670" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">
    🛑 Emergency Stop
  </text>
</svg>
