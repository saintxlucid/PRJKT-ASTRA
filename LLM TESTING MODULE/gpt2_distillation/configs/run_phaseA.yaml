student_model: gpt2-large
lora: {enabled: true, r: 16, alpha: 32, dropout: 0.05}
context_length: 512
temperature: 3.0
loss_weights: {kd: 0.8, ce: 0.2, seq: 0.0, hint: 0.0}
optimizer: {lr: 3e-5, wd: 0.1, betas: [0.9, 0.95]}
sched: {type: cosine, warmup_steps: 1000, total_steps: 15000}
packing: true
grad_checkpointing: true
precision: fp16
deepspeed_config: configs/deepspeed_zero2.json
data:
  mixes:
    - name: general_instruct
      path: data/general.jsonl
      weight: 0.4
    - name: arabic_eg
      path: data/ar_eg.jsonl
      weight: 0.2
    - name: cot_reasoning
      path: data/cot.jsonl
      weight: 0.2
    - name: coding
      path: data/code.jsonl
      weight: 0.2
  sampler: {type: entropy_weighted, a: 0.5, b: 0.8, min: 0.3, max: 1.5}