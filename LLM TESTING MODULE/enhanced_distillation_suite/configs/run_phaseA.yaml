student_model: gpt2-large
output_dir: models/phaseA
context_length: 512
precision: fp16
temperature: 3.0
grad_accum: 16
packing: true
optimizer:
  lr: 3e-5
  wd: 0.1
  betas: [0.9, 0.95]
sched:
  type: cosine
  warmup_steps: 1000
  total_steps: 15000
loss_weights: {kd: 0.8, ce: 0.2, seq: 0.0, hint: 0.0}
lora: {enabled: true, r: 16, alpha: 32, dropout: 0.05}
data:
  mixes:
    - {name: general_instruct, path: data/general.jsonl, weight: 0.4}
    - {name: arabic_eg, path: data/ar_eg.jsonl, weight: 0.2}
    - {name: cot_reasoning, path: data/cot.jsonl, weight: 0.2}
    - {name: coding, path: data/code.jsonl, weight: 0.2}
  sampler: {type: entropy_weighted, a: 0.5, b: 0.8, min: 0.3, max: 1.5}