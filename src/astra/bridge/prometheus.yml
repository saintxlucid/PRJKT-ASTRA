# Prometheus configuration for ASTRA Bridge
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bridge'
    static_configs:
      - targets: ['bridge:8000']
    metrics_path: '/metrics'
    
  - job_name: 'astra-api'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'

  - job_name: 'astra-docs'
    static_configs:
      - targets: ['docs:8777']
    metrics_path: '/metrics'
