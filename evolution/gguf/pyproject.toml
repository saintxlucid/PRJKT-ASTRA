[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-gguf-surgery"
version = "1.0.0"
description = "GGUF model surgery tools for ASTRA"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["gguf", "lora", "model", "ai"]
authors = [
    { name = "ASTRA Team" }
]
dependencies = [
    "numpy>=1.19.0",
    "fastapi>=0.68.0",
    "pydantic>=1.8.0",
    "click>=8.0.0",
    "uvicorn>=0.15.0"
]

[project.scripts]
gguf-merge = "evolution.gguf.cli:merge"
gguf-validate = "evolution.gguf.cli:validate"
gguf-commit = "evolution.gguf.cli:commit"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=evolution.gguf --cov-report=xml"
testpaths = [
    "tests/evolution",
]