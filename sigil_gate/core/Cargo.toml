[package]
name = "sigil_gate_core"
version = "0.1.0"
edition = "2021"
authors = ["ASTRA Project"]
description = "Hardened PQC token system with plan-binding, leases, and revocation"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_cbor = "0.11"
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
regex = "1.10"
globset = "0.4"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
base64 = "0.21"

# Post-Quantum Cryptography (Dilithium)
pqcrypto-dilithium = { version = "0.5", features = ["dilithium2"] }
pqcrypto-traits = "0.3"

# Classical ECDSA (P-256)
p256 = { version = "0.13", features = ["ecdsa"] }
ecdsa = { version = "0.16", features = ["signing", "verifying"] }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3.8"
