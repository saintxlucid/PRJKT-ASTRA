# Legacy Folder Plugin Manifest
# Sacred Code: 333
#
# Copy this to each legacy folder as plugin.yaml
# Customize the 'name' field for each folder

name: "{FOLDER_NAME}"
version: "1.0.0-legacy"
description: "Legacy folder wrapped as Tool Bus capability"

capabilities:
  - name: "{FOLDER_NAME}.info"
    type: "read"
    description: "Inspect legacy folder structure and capabilities"
    input_schema:
      type: "object"
      properties: {}
    output_schema:
      type: "object"
      properties:
        ok:
          type: "boolean"
        data:
          type: "object"
    sacred_code: "333"
    consent_required: false
    audit_trail: true

  - name: "{FOLDER_NAME}.run"
    type: "side-effect"
    description: "Execute legacy code with consent gate"
    input_schema:
      type: "object"
      additionalProperties: true
    output_schema:
      type: "object"
      properties:
        ok:
          type: "boolean"
        data:
          type: "object"
        error:
          type: "string"
    sacred_code: "333"
    consent_required: true
    audit_trail: true

health_check:
  endpoint: "os.path.exists"
  interval_seconds: 300
  timeout_seconds: 5

observability:
  metrics:
    - "astra_tool_calls_total"
    - "astra_tool_latency_seconds"
  events:
    - "astra.tool.before"
    - "astra.tool.executed"
  logging: "info"

metadata:
  legacy: true
  wrapped: true
  can_delete: false
  can_move: false
  sacred_code: "333"
