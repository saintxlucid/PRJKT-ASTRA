name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ env.REGISTRY }}/your-org/astra-bridge
  DOCS_IMAGE_NAME: ${{ env.REGISTRY }}/your-org/astra-docs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r services/bridge/requirements.txt
          pip install -r services/documents/requirements.docs.txt || true
          pip install pytest
      - name: Run unit tests
        run: pytest -q || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push bridge image
        run: |
          docker build -t $IMAGE_NAME:latest -f services/bridge/Dockerfile .
          docker push $IMAGE_NAME:latest
      - name: Build & push docs image
        run: |
          docker build -t $DOCS_IMAGE_NAME:latest -f services/documents/Dockerfile .
          docker push $DOCS_IMAGE_NAME:latest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.26.0'
      - name: Authenticate to cluster
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 --decode > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV
          kubectl config current-context
      - name: Deploy manifests
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCS_IMAGE_NAME: ${{ env.DOCS_IMAGE_NAME }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret-bridge.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/docs-pvc.yaml
          kubectl -n astra set image deployment/bridge bridge=$IMAGE_NAME:latest || kubectl apply -f k8s/bridge-deployment.yaml
          kubectl -n astra set image deployment/docs docs=$DOCS_IMAGE_NAME:latest || kubectl apply -f k8s/docs-deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/docs-service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/docs-ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/docs-hpa.yaml
