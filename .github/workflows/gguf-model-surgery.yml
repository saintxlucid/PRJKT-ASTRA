name: GGUF Model Surgery CI

on:
  push:
    branches: [ main ]
    paths:
      - 'evolution/gguf/**'
      - 'tests/evolution/test_gguf.py'
      - 'tests/evolution/test_rope_grammar.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'evolution/gguf/**'
      - 'tests/evolution/test_gguf.py'
      - 'tests/evolution/test_rope_grammar.py'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov numpy fastapi pydantic click
        pip install -e .
        
    - name: Create test data
      run: |
        mkdir -p test_data
        # Create mock GGUF files for testing
        python -c "
        import numpy as np
        import pickle
        
        # Base model
        base = {
            'header': {'version': 1},
            'tensors': {'layer.0.weight': np.random.randn(1024, 1024)},
            'kv': {'arch.name': 'llama', 'rope.scale': 1.0}
        }
        with open('test_data/base.gguf', 'wb') as f:
            pickle.dump(base, f)
            
        # LoRA adapter
        adapter = {
            'header': {'version': 1},
            'tensors': {'layer.0.weight': np.random.randn(1024, 1024) * 0.1},
            'kv': {'astra.type': 'lora'}
        }
        with open('test_data/adapter.gguf', 'wb') as f:
            pickle.dump(adapter, f)
        "
        
    - name: Run tests
      run: |
        pytest tests/evolution/test_gguf.py tests/evolution/test_rope_grammar.py --cov=evolution.gguf -v
        
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        
    - name: Lint
      run: |
        flake8 evolution/gguf
        black --check evolution/gguf
        isort --check-only evolution/gguf
        mypy evolution/gguf

  acceptance:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Run acceptance tests
      run: |
        # Test LoRA merging
        python -m evolution.gguf.cli merge \
          --base test_data/base.gguf \
          --manifest test_data/manifest.json \
          --out test_data/merged.gguf \
          --quant Q5_K_M
          
        # Test validation
        python -m evolution.gguf.cli validate \
          --base test_data/base.gguf \
          --out test_data/merged.gguf \
          --dataset eval/*
          
        # Test commit
        python -m evolution.gguf.cli commit \
          --out test_data/merged.gguf \
          --require-gates