name: Go-Live Validation
on:
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt locust requests pytest
      - name: Launch ASTRA (uvicorn)
        run: |
          nohup python -m uvicorn app:app --host 0.0.0.0 --port 8080 & echo $! > uv.pid
          sleep 3
      - name: Go-Live Checks
        run: |
          python tools/go_live_check.py --host http://127.0.0.1:8080
      - name: Load Test (Locust)
        run: |
          locust -f tools/locustfile.py --headless -u 60 -r 30 -t 1m -H http://127.0.0.1:8080 --csv=locust_out
      - name: Parse SLOs
        run: |
          python - <<'PY'
          import csv, sys
          def p95(path):
            with open(path) as f:
              r=list(csv.DictReader(f))
              for row in r:
                if row['Name']=='answer' and row['Metric']=='95%':
                  return float(row['Value'])
          v=p95('locust_out_requests.csv')
          print('p95 answer ms:', v)
          sys.exit(0 if v and v<=2500 else 1)
          PY
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: go-live-artifacts, path: |
          go_live_validation_report.md
          locust_out_*.csv
        }
      - name: Stop ASTRA
        if: always()
        run: kill $(cat uv.pid) || true