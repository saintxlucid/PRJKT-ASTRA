name: Docs CI

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"  # nightly 03:00 UTC

jobs:
  validate-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (for pre-commit if needed)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run docs guardrail
        shell: pwsh
        run: scripts/docs_guardrail.ps1
      - name: Check external links (non-blocking)
        shell: pwsh
        continue-on-error: true
        run: scripts/docs_external_links.ps1
      - name: Upload health artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-health
          path: docs/docs_health.json
          retention-days: 30
