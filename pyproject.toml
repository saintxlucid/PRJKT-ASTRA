[tool.poetry]
name = "project-astra"
version = "2.0.0"
description = "Local AI Assistant with Semantic Memory and LLM Integration"
authors = ["ASTRA Team"]
readme = "README.md"
license = "MIT"
packages = [{include = "astra", from = "src"}]
repository = "https://github.com/yourusername/project-astra"
keywords = ["ai", "llm", "chatbot", "assistant", "rag", "memory"]

[tool.poetry.dependencies]
python = "^3.11"
# Core framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
# Data validation and settings
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
# Database and storage
sqlalchemy = "^2.0.35"
chromadb = "^0.5.23"
# LLM and embeddings
openai = "^1.50.0"
sentence-transformers = "^3.3.1"
# HTTP client
httpx = "^0.27.2"
# File handling
python-multipart = "^0.0.17"
# Configuration
pyyaml = "^6.0.2"
python-dotenv = "^1.0.1"
# Logging
structlog = "^24.4.0"
# Utilities
tenacity = "^9.0.0"  # Retry logic
click = "^8.1.7"  # CLI framework

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
httpx-sse = "^0.4.0"  # For testing SSE
# Code quality
black = "^24.10.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
# Git hooks
pre-commit = "^4.0.1"
# Type stubs
types-pyyaml = "^6.0.12"
# Documentation
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.42"

[tool.poetry.scripts]
astra = "astra.cli:main"
astra-api = "astra.api.main:main"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=src/astra --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
