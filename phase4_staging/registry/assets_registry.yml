notes: |
  Status Legend:
  - staged: ready for ingestion
  - pending: awaiting ingestion
  - in_progress: currently ingesting
  - validated: ingested and tested
  - promoted: moved to production
  - failed: ingestion failed, review notes
  
  Next Actions:
  1. Run clone_and_download.sh to ingest repos and datasets
  2. Execute integration tests in order
  3. Update this registry with results
  4. Once all criteria pass, schedule production promotion
  5. Create release bundle and migration plan
