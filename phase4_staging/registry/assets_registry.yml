integration_tests:
  - test_id: "test_001"
    name: "Repo Clone & Build Smoke Test"
    description: "Clone all repos and run basic build/test if available"
    status: "not_started"
    
  - test_id: "test_002"
    name: "Dataset Load & Disk Save"
    description: "Load HF datasets and verify saved to disk with expected schema"
    status: "not_started"
    
  - test_id: "test_003"
    name: "Vector Embedding & Indexing"
    description: "Embed datasets and create indexes in staging vector store"
    status: "not_started"
    
  - test_id: "test_004"
    name: "Retrieval Validation (10 queries per dataset)"
    description: "Run 10 sample queries and validate results meet relevancy thresholds"
    status: "not_started"
    
  - test_id: "test_005"
    name: "Agent Module Wiring"
    description: "Wire modules into agent layer and run end-to-end flows"
    status: "not_started"
    
  - test_id: "test_006"
    name: "Performance & Observability"
    description: "Measure latency, throughput, contradiction rates. Validate monitoring."
    status: "not_started"

