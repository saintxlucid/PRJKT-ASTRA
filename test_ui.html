<!DOCTYPE html>
<html>
<head>
    <title>ASTRA API Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        button { padding: 10px; margin: 5px; cursor: pointer; background: #333; color: #0f0; border: 1px solid #0f0; }
        #output { white-space: pre-wrap; margin-top: 20px; border: 1px solid #0f0; padding: 10px; }
        .error { color: #f00; }
        .success { color: #0f0; }
    </style>
</head>
<body>
    <h1>ASTRA Quick Test</h1>
    <button onclick="testHealth()">1. Test Health</button>
    <button onclick="testConversation()">2. Create Conversation</button>
    <button onclick="testChat()">3. Send Chat Message</button>
    <button onclick="testStream()">4. Test Streaming</button>
    
    <div id="output">Click buttons in order to test...</div>

    <script>
        const API_BASE = 'http://localhost:8080';
        let convId = null;
        
        function log(msg, isError = false) {
            const output = document.getElementById('output');
            output.innerHTML += `\n${isError ? '[ERROR] ' : '[OK] '}${msg}`;
        }
        
        async function testHealth() {
            document.getElementById('output').innerHTML = 'Testing health endpoint...';
            try {
                const resp = await fetch(`${API_BASE}/v1/system/health`);
                const data = await resp.json();
                log(`Health: ${JSON.stringify(data, null, 2)}`);
            } catch (e) {
                log(`Health check failed: ${e.message}`, true);
            }
        }
        
        async function testConversation() {
            log('\n\nCreating conversation...');
            try {
                const resp = await fetch(`${API_BASE}/v1/conversations`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title: 'Test', system_prompt: 'You are ASTRA.'})
                });
                const data = await resp.json();
                convId = data.conversation_id;
                log(`Created conversation: ${convId}`);
            } catch (e) {
                log(`Conversation creation failed: ${e.message}`, true);
            }
        }
        
        async function testChat() {
            if (!convId) {
                log('Create conversation first!', true);
                return;
            }
            log('\n\nSending chat message...');
            try {
                const resp = await fetch(`${API_BASE}/v1/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        conversation_id: convId,
                        message: 'Say "TEST OK"'
                    })
                });
                const data = await resp.json();
                log(`Response: ${data.message}`);
            } catch (e) {
                log(`Chat failed: ${e.message}`, true);
            }
        }
        
        async function testStream() {
            if (!convId) {
                log('Create conversation first!', true);
                return;
            }
            log('\n\nTesting streaming...');
            try {
                const resp = await fetch(`${API_BASE}/v1/chat/stream`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        conversation_id: convId,
                        message: 'Count 1 to 3'
                    })
                });
                
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';
                
                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                log(`\nStream complete. Full text: "${fullText}"`);
                            } else {
                                fullText += data;
                            }
                        }
                    }
                }
            } catch (e) {
                log(`Streaming failed: ${e.message}`, true);
            }
        }
    </script>
</body>
</html>
