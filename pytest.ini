[pytest]
addopts = -ra
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test selection markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services
    llm: marks LLM-related tests that require model access
    asyncio: mark tests that are async and need an event loop
    load: marks load tests that simulate concurrent users
    stress: marks stress tests that verify system limits