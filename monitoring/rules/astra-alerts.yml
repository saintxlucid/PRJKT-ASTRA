groups:
- name: astra
  rules:
  - alert: HighLatency
    expr: histogram_quantile(0.95, sum(rate(astra_api_latency_seconds_bucket[5m])) by (le)) > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High API latency detected
      description: 95th percentile latency is above 500ms for 5 minutes

  - alert: LowUptime
    expr: astra_ws_uptime_ratio < 99
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: WebSocket uptime below SLO
      description: WebSocket uptime has dropped below 99% for 5 minutes

  - alert: LargeContextSize
    expr: sum(astra_context_bytes_total) > 104857600
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Large context size detected
      description: Total context size has exceeded 100MB for 5 minutes

  - alert: HighErrorRate
    expr: sum(rate(astra_errors_total[5m])) > 1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: High error rate detected
      description: Error rate has exceeded 1 error per second for 5 minutes

  - alert: LogSamplingDropped
    expr: rate(astra_logs_sampled_total[5m]) / rate(astra_logs_total[5m]) < 0.01
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Log sampling rate too low
      description: Log sampling rate has dropped below 1% for 5 minutes