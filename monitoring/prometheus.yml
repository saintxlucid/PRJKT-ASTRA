global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'astra'
    static_configs:
      - targets: ['localhost:9090']

    metrics_path: '/metrics'
    scheme: 'http'

rule_files:
  - 'rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'